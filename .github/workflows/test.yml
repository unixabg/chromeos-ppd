name: test
on: [push, pull_request]
jobs:
  ppds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript cups cups-filters python3-pil git curl g++ make \
            pkg-config patch libcups2-dev libqpdf-dev liblcms2-dev libfreetype-dev \
            libfontconfig-dev libjpeg-dev libpng-dev libtiff-dev zlib1g-dev libdbus-1-dev
      - name: PPDs are up to date with profiles
        run: |
          python3 families/thermal/ppdgen.py --all
          git diff --exit-code ppd/
      - name: Cache ChromeOS emulator
        uses: actions/cache@v4
        with:
          path: checker/emulator/build
          key: chromeos-emulator-${{ hashFiles('checker/emulator/build.sh', 'checker/emulator/stub/**', 'checker/emulator/fsmain.cc') }}
      - name: Build ChromeOS emulator
        run: bash checker/emulator/build.sh
      - name: ChromeOS checker on every PPD (2-page document)
        run: python3 checker/chromeos_ppd_check.py ppd/*.ppd --pages 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews
          path: check-out/
